name: Test

on: [push, pull_request]

jobs:
    test:
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [macos-latest, windows-latest, ubuntu-latest]

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v3

            - name: Install Node.js and NPM
              uses: actions/setup-node@v3
              with:
                  node-version: 18
                  cache: npm

            - name: Install bun
              run: |
                npm install -g bun

            - name: bun install
              run: |
                  bun

            - name: Test frontend
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  bun test

            - name: Test build electron
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  bun build:electron

            - name: Test build web
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  bun build:web
